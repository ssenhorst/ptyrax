__main__:

# ==============================================================================
# From ptyrax/__main__.py
# ==============================================================================
  main:
    sweep_id: null
  ptyrax:
    mode: reconstruct
    debug: false
    sweep_id: null
  set_seed:
    seed: 42

# ==============================================================================
# From ptyrax/dataset.py
# ==============================================================================
  add_poisson_noise:
