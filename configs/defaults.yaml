    scale: 1.0
    normalize: true
  usaf_test_target:
    high_amplitude: 1.0
    high_phase: 0.0
    low_amplitude: 0.0
    low_phase: 0.0
    scale: 1.0
    center:
    - 0.0
    - 0.0
    normalize: false
    svg_path: null
