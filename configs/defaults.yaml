    total_photon_count: null
    total_power: null
    wavelength: null
    exposure_time: null
    diffraction_pattern_normalized: true
  apply_orientation:
    orientation: 0
    darkframe_orientation: null
  batch:
    batch_size: 1
    shuffle_mode: random
  clip_low_intensity:
    pixel_ratio: 0.9
  cut_center:
    ratio: 0.5
  exclude_positions_by_distance:
