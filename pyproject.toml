[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptyrax"
version = "0.3.0"
description = "A solver for the ptychographical inverse problem using JAX-based automatic differentiation."
authors = [{ name = "Sander Senhorst", email = "sander@senhorst.science" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ptychography", "automatic differentiation", "jax"]
classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Intended Audience :: Science/Research",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.3",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "jax",
    "optax",
    "chex",
    "tensorboardx",
    "matplotlib",
    "h5py",
    "gin-config",
    "tensorboard",
    "tqdm",
    "equinox",
    "jaxwt",
    "pandas",
    "requests",
    "untangle",
    "imageio",
    "openpyxl",
    "scipy",
    "jaxtyping",
    "scikit-image",
    "vispy",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "ruamel-yaml>=0.18.16",
    "periodictable>=2.0.2",
    "dvc>=3.65.0",
    "cairosvg>=2.8.2",
    "chromatix",
]

[project.optional-dependencies]
cuda = ["jax[cuda12];  sys_platform != 'darwin'",
        "jax-metal; sys_platform == 'darwin'"]
docs = [
    "sphinx>=6.1",
    "sphinx-book-theme>=0.4",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=0.19",
    "myst-nb>=0.14",
    "sphinx-autodoc-typehints>=1.22",
    "sphinx-autobuild>=0.8",
    "typeguard==2.13.3",
]

[project.scripts]
"ptyrax" = "ptyrax.__main__:main"

[dependency-groups]
dev = [
    "ipython",
    "pytest",
    "notebook",
    "jupyterlab",
    "ipykernel",
    "tensorflow>=2.20.0",
    "ruff",
    "docformatter>=1.7.7",
]

[tool.pytest]
testpaths = ["ptyrax"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "scripts",
    "notebooks",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F", "I", "N", "Q", "S", "T", "YTT", "ANN"]
ignore = ["F722", "E203", "ANN002", "ANN003", "ANN202", "N806", "N803", "N802"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.uv.sources]
chromatix = { git = "https://github.com/chromatix-team/chromatix.git" }

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]
